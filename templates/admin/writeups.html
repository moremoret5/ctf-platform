{% extends "admin/admin_base.html" %}
{% block content %}

<h2>Управление Writeups</h2>

<form method="POST" enctype="multipart/form-data">

    <label>Задание</label>
    <select name="challenge_id">
        {% for c in challenges %}
        <option value="{{ c.id }}">{{ c.title }}</option>
        {% endfor %}
    </select>

    <label>Файл writeup</label>
    <input type="file" name="file">

    <button type="submit">Загрузить</button>

</form>

<hr>

<h3>Существующие writeups</h3>

{% for w in writeups %}
<div class="card">
    <p>{{ w.challenge.title }}</p>
    <a href="{{ url_for('view_writeup_file', writeup_id=w.id) }}">Открыть</a>
</div>
{% endfor %}

{% endblock %}
